version: 2

models:
  - name: orders
    description: "注文ヘッダー（クレンジング済み）。タイムスタンプ型に統一。"
    columns:
      - name: order_id
        description: "注文ID（STRING）"
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "顧客ID（STRING）"
        tests:
          - not_null
      - name: order_status
        description: "注文ステータス"
        tests:
          - not_null
      - name: order_purchase_timestamp
        description: "注文日時（TIMESTAMP）"
        tests:
          - not_null
      - name: order_approved_at
        description: "承認日時（TIMESTAMP）"
      - name: order_delivered_carrier_date
        description: "配送業者への引き渡し日時（TIMESTAMP）"
      - name: order_delivered_customer_date
        description: "顧客への配達日時（TIMESTAMP）"
      - name: order_estimated_delivery_date
        description: "配達予定日（TIMESTAMP）"

  - name: order_items
    description: "注文明細（クレンジング済み）。数値・日付型に統一。"
    columns:
      - name: order_id
        description: "注文ID（STRING）"
        tests:
          - not_null
      - name: order_item_id
        description: "注文明細連番（INT64）"
        tests:
          - not_null
      - name: product_id
        description: "商品ID（STRING）"
        tests:
          - not_null
      - name: seller_id
        description: "販売者ID（STRING）"
        tests:
          - not_null
      - name: shipping_limit_date
        description: "発送期限（TIMESTAMP）"
      - name: price
        description: "商品価格（FLOAT64）"
        tests:
          - not_null
      - name: freight_value
        description: "送料（FLOAT64）"
        tests:
          - not_null

  - name: customers
    description: "顧客情報（クレンジング済み）。customer_city を TRIM+LOWER で表記揺れ正規化。"
    columns:
      - name: customer_id
        description: "顧客ID（STRING）"
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: "顧客ユニークID（STRING）"
        tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "郵便番号プレフィックス（STRING）"
        tests:
          - not_null
      - name: customer_city
        description: "市区町村（LOWER・TRIM済み）"
        tests:
          - not_null
      - name: customer_state
        description: "州（UPPER・TRIM済み）"
        tests:
          - not_null

  - name: sellers
    description: "販売者マスタ（クレンジング済み）。seller_city を TRIM+LOWER で表記揺れ正規化。"
    columns:
      - name: seller_id
        description: "販売者ID（STRING）"
        tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        description: "郵便番号プレフィックス（STRING）"
        tests:
          - not_null
      - name: seller_city
        description: "市区町村（LOWER・TRIM済み）"
        tests:
          - not_null
      - name: seller_state
        description: "州（UPPER・TRIM済み）"
        tests:
          - not_null

  - name: products
    description: "商品マスタ（クレンジング済み）。product_category_name の NULL 約610件を 'unknown' に補完。"
    columns:
      - name: product_id
        description: "商品ID（STRING）"
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: "カテゴリ名（NULLは 'unknown' に補完済み）"
        tests:
          - not_null
      - name: product_name_lenght
        description: "商品名文字数"
      - name: product_description_lenght
        description: "説明文字数"
      - name: product_photos_qty
        description: "写真枚数"
      - name: product_weight_g
        description: "重量（g）"
      - name: product_length_cm
        description: "長さ（cm）"
      - name: product_height_cm
        description: "高さ（cm）"
      - name: product_width_cm
        description: "幅（cm）"

  - name: order_reviews
    description: "注文レビュー（クレンジング済み）。review_id の重複 約814件を ROW_NUMBER()+QUALIFY で排除し1件に絞り込み。"
    columns:
      - name: review_id
        description: "レビューID（STRING）"
        tests:
          - not_null
          - unique
      - name: order_id
        description: "注文ID（STRING）"
        tests:
          - not_null
      - name: review_score
        description: "スコア（1-5、INT64）"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
      - name: review_comment_title
        description: "レビュータイトル"
      - name: review_comment_message
        description: "レビュー本文"
      - name: review_creation_date
        description: "レビュー作成日時（TIMESTAMP）"
      - name: review_answer_timestamp
        description: "回答日時（TIMESTAMP）"

  - name: order_payments
    description: "支払情報（クレンジング済み）。payment_type の 'not_defined' 約3件を 'unknown' に正規化。"
    columns:
      - name: order_id
        description: "注文ID（STRING）"
        tests:
          - not_null
      - name: payment_sequential
        description: "支払連番（INT64）"
        tests:
          - not_null
      - name: payment_type
        description: "支払方法（'not_defined' → 'unknown' 正規化済み）"
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'unknown']
      - name: payment_installments
        description: "分割払い回数（INT64）"
        tests:
          - not_null
      - name: payment_value
        description: "支払金額（FLOAT64）"
        tests:
          - not_null

  - name: geolocation
    description: "郵便番号×緯度経度（クレンジング済み）。同一郵便番号の複数座標を AVG で集約し、zip_code_prefix 単位の1件に集約。"
    columns:
      - name: geolocation_zip_code_prefix
        description: "郵便番号プレフィックス（STRING）"
        tests:
          - not_null
          - unique
      - name: geolocation_lat
        description: "緯度（AVG集約済み）"
        tests:
          - not_null
      - name: geolocation_lng
        description: "経度（AVG集約済み）"
        tests:
          - not_null
      - name: geolocation_city
        description: "市区町村（LOWER・TRIM済み）"
      - name: geolocation_state
        description: "州（UPPER・TRIM済み）"

  - name: product_category_name_translation
    description: "カテゴリ翻訳マスタ（クレンジング済み）。NULL カテゴリ名を除外。"
    columns:
      - name: product_category_name
        description: "カテゴリ名（ポルトガル語）"
        tests:
          - not_null
          - unique
      - name: product_category_name_english
        description: "カテゴリ名（英語）"
