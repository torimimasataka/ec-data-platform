name: 'ec_data_platform'
version: '1.0.0'

profile: 'ec_data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ec_data_platform:
    # 01_import: ローデータをBigQueryに取り込み（外部テーブル or ロード済み前提）
    01_import:
      +materialized: view
      +schema: import

    # 02_preprocess: クレンジング・型変換・表記揺れ対応
    02_preprocess:
      +materialized: table
      +schema: preprocess

    # 03_unification: トランザクション×マスタ統合テーブル
    03_unification:
      +materialized: table
      +schema: unification

    # 04_intermediate: 分析粒度ごとの中間テーブル
    04_intermediate:
      +materialized: table
      +schema: intermediate

    # 05_application: Looker Studio向け最終テーブル
    05_application:
      +materialized: table
      +schema: application
